# Render 배포 설정 (https://render.com)
#
# 이 파일이 저장소 루트에 있으면, Render에서 "New +" > "Blueprint" 로
# 이 저장소를 연결할 때 아래 서비스 설정이 자동으로 잡힌다.
#
# 배포 후 해야 할 일:
#  1. Render 대시보드에서 이 서비스의 Environment 에 GEMINI_API_KEY 값을 입력
#     (sync: false 로 되어 있어 값은 대시보드에서 직접 넣어야 함 = 키가 저장소에 안 올라감)
#  2. 배포된 URL(https://scroless-backend.onrender.com 등)을
#     확장 프로그램 src/config.js 의 backendUrl 과 manifest.json 의 host_permissions 에 반영
services:
  - type: web
    name: scroless-backend
    runtime: node
    rootDir: server            # 서버 코드가 server/ 하위에 있음
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false            # 값은 대시보드에서 직접 입력 (저장소에 노출 안 됨)
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: NODE_VERSION
        value: "20"
