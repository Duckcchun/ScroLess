  <line x1="40" y1="220" x2="560" y2="220" stroke="#111" stroke-width="2"/>
  <text x="60"  y="270" font-family="sans-serif" font-size="26" fill="#111">사이즈</text>
  <text x="230" y="270" font-family="sans-serif" font-size="26" fill="#111">총장</text>
  <text x="380" y="270" font-family="sans-serif" font-size="26" fill="#111">어깨</text>
  <line x1="40" y1="290" x2="560" y2="290" stroke="#888" stroke-width="1"/>

  <text x="60"  y="340" font-family="sans-serif" font-size="26" fill="#333">S</text>
  <text x="230" y="340" font-family="sans-serif" font-size="26" fill="#333">68</text>
  <text x="380" y="340" font-family="sans-serif" font-size="26" fill="#333">50</text>

