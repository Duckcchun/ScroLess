  <text x="40" y="650" font-family="sans-serif" font-size="24" fill="#333">30도 이하 손세탁, 표백제 사용 금지</text>
  <text x="40" y="690" font-family="sans-serif" font-size="24" fill="#333">건조기 사용 금지, 그늘에서 건조</text>
