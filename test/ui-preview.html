<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ScroLess UI 미리보기 (키비주얼 확인용)</title>
    <!-- 실제 확장과 동일한 스타일을 그대로 불러온다 -->
    <link rel="stylesheet" href="../src/styles.css" />
    <style>
      body {
        margin: 0;
        min-height: 200vh;
        background: linear-gradient(#fafafa, #eef2f3);
        font-family: sans-serif;
      }
      .note {
        max-width: 560px;
        margin: 40px auto;
        padding: 20px;
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
        color: #333;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <div class="note">
      <h2>ScroLess UI 미리보기</h2>
      <p>
        이 페이지는 확장 프로그램 없이 브랜드 톤(키비주얼)이 적용된 인덱스와 요약 칩이
        어떻게 보이는지 확인하기 위한 정적 미리보기입니다. 우측 인덱스의 접기(▾) 버튼도
        동작합니다.
      </p>
    </div>

    <!-- 상단 요약 칩 (content.js 가 만드는 것과 동일한 마크업) -->
    <div class="sl-chips" role="list" aria-label="상품 핵심 정보 요약">
      <span class="sl-chip" role="listitem"
        ><span class="sl-chip__key">총기장</span
        ><span class="sl-chip__value">72cm</span
        ><span class="sl-chip__base">(M 기준)</span></span
      >
      <span class="sl-chip" role="listitem"
        ><span class="sl-chip__key">계절감</span
        ><span class="sl-chip__value">봄·가을</span></span
      >
      <span class="sl-chip" role="listitem"
        ><span class="sl-chip__key">핏</span
        ><span class="sl-chip__value">세미오버핏</span></span
      >
      <span class="sl-chip" role="listitem"
        ><span class="sl-chip__key">혼용률</span
        ><span class="sl-chip__value">코튼 100%</span></span
      >
    </div>

    <!-- 플로팅 스마트 인덱스 (content.js 마크업과 동일) -->
    <nav class="sl-index" aria-label="상품 정보 스마트 인덱스">
      <div class="sl-index__header">
        <span class="sl-index__brand">
          <span class="sl-index__logo">
            <img class="sl-brand-img" src="../icons/icon128.png" alt="" aria-hidden="true" />
          </span>
          <span>ScroLess</span>
        </span>
        <button type="button" class="sl-index__toggle" aria-label="인덱스 접기/펼치기" aria-expanded="true">▾</button>
      </div>
      <!-- 착용샷이 색상별로 많은 "긴 인덱스" 케이스: 뷰포트를 넘으면 이 목록 안에서 스크롤된다.
           각 항목은 실제 content.js 가 만드는 것과 동일하게 [아이콘 span + 라벨 span] 구조다. -->
      <div class="sl-index__items">
        <button type="button" class="sl-index__item sl-active" aria-current="true">
          <span class="sl-index__icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8h18v8H3z"/><path d="M7 8v3M11 8v4M15 8v3M19 8v4"/></svg></span>
          <span class="sl-index__label">사이즈 및 실측표</span>
        </button>
        <button type="button" class="sl-index__item">
          <span class="sl-index__icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 4l6 3 6-3 3 5-4 2v9H7v-9L3 9z"/></svg></span>
          <span class="sl-index__label">블랙 착용샷</span>
        </button>
        <button type="button" class="sl-index__item">
          <span class="sl-index__icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 4l6 3 6-3 3 5-4 2v9H7v-9L3 9z"/></svg></span>
          <span class="sl-index__label">아이보리 착용샷</span>
        </button>
        <button type="button" class="sl-index__item">
          <span class="sl-index__icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 4l6 3 6-3 3 5-4 2v9H7v-9L3 9z"/></svg></span>
          <span class="sl-index__label">차콜 착용샷</span>
        </button>
        <button type="button" class="sl-index__item">
          <span class="sl-index__icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 4l6 3 6-3 3 5-4 2v9H7v-9L3 9z"/></svg></span>
          <span class="sl-index__label">베이지 착용샷</span>
        </button>
        <button type="button" class="sl-index__item">
          <span class="sl-index__icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 4l6 3 6-3 3 5-4 2v9H7v-9L3 9z"/></svg></span>
          <span class="sl-index__label">카키 착용샷</span>
        </button>
        <button type="button" class="sl-index__item">
          <span class="sl-index__icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7c3-3 5 3 8 0s5 3 8 0M4 12c3-3 5 3 8 0s5 3 8 0M4 17c3-3 5 3 8 0s5 3 8 0"/></svg></span>
          <span class="sl-index__label">소재 및 디테일 컷</span>
        </button>
        <button type="button" class="sl-index__item">
          <span class="sl-index__icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3s6 7 6 11a6 6 0 0 1-12 0c0-4 6-11 6-11z"/></svg></span>
          <span class="sl-index__label">세탁 및 취급 주의사항</span>
        </button>
      </div>
    </nav>

    <!-- 로딩 인디케이터(단계별) 미리보기: 실제로는 분석 중에만 잠깐 뜬다.
         버튼으로 수집중/분석중 문구를 토글해볼 수 있다. -->
    <div class="sl-status sl-status--loading" role="status" aria-live="polite" style="bottom: 90px;">
      <span class="sl-spinner" aria-hidden="true"></span>
      <span class="sl-status__text">
        <span class="sl-status__main" id="preview-loading-main">AI가 상품 정보를 분석하고 있어요…</span>
        <span class="sl-status__sub" id="preview-loading-sub">이미지가 많으면 조금 걸릴 수 있어요</span>
      </span>
    </div>

    <!-- 분석 완료 후의 FAB "다시 분석" 상태 미리보기 -->
    <button id="preview-fab" type="button" class="sl-fab sl-fab--reanalyze" aria-label="ScroLess로 상품 정보 다시 분석하기">
      <span class="sl-fab__logo">
        <img class="sl-brand-img" src="../icons/icon128.png" alt="" aria-hidden="true" />
      </span>
      <span class="sl-fab__label">다시 분석</span>
    </button>

    <script>
      // 접기/펼치기 토글 (미리보기용 - 실제 로직은 content.js 에 있음)
      var panel = document.querySelector(".sl-index");
      var toggle = document.querySelector(".sl-index__toggle");
      toggle.addEventListener("click", function () {
        var collapsed = panel.classList.toggle("sl-collapsed");
        toggle.setAttribute("aria-expanded", String(!collapsed));
        toggle.textContent = collapsed ? "▸" : "▾";
      });

      // 항목 클릭 시 활성 하이라이트 이동 (실제 로직은 content.js 클릭 핸들러에 있음)
      var items = document.querySelectorAll(".sl-index__item");
      items.forEach(function (btn) {
        btn.addEventListener("click", function () {
          items.forEach(function (el) {
            el.classList.remove("sl-active");
            el.removeAttribute("aria-current");
          });
          btn.classList.add("sl-active");
          btn.setAttribute("aria-current", "true");
        });
      });
    </script>
  </body>
</html>
